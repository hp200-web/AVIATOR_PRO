<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Admin Control Panel - CV999</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #0c0d10; color: #fff; padding: 15px; }
    h1 { color: #ff8c00; text-align: center; margin-bottom: 20px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
    .card { background: #14151b; border: 1px solid #ff8c00; padding: 15px; border-radius: 8px; }
    h2 { color: #ff8c00; font-size: 14px; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 6px; }
    label { font-size: 11px; color: #aaa; display: block; margin-top: 6px; }
    input[type="text"], input[type="number"], input[type="url"], select, textarea {
      width: 100%; padding: 8px; margin: 4px 0 10px; background: #0a0b0d; border: 1px solid #2a2b32; color: #fff; border-radius: 4px; font-size: 12px;
    }
    textarea { height: 100px; resize: vertical; font-family: monospace; }
    button { padding: 8px 12px; background: linear-gradient(90deg, #ff8c00, #e65100); border: none; color: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 12px; }
    .btn-green { background: #28a745; width: auto; padding: 5px 10px; margin-right: 4px; }
    .btn-red { background: #dc3545; width: auto; padding: 5px 10px; }
    .item-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
    .item-list li { background: #1c1d24; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 11px; border: 1px solid #2a2b32; }
    .chat-user-btn { background: #2563eb; margin-bottom: 4px; padding: 6px; text-align: left; border-radius: 4px; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <h1>👑 এডমিন কন্ট্রোল প্যানেল</h1>

  <div class="grid">
    <!-- ১. সাইট সেটিংস -->
    <div class="card">
      <h2>🌐 সাইট সেটিংস, নাম ও ব্যানার</h2>
      <label>সাইটের নাম (Site Name)</label>
      <input type="text" id="siteTitleInput" placeholder="CV999">
      <label>পেমেন্ট নম্বর</label>
      <input type="text" id="adminNumberInput" placeholder="017xxxxxxxx">
      <label>ব্যানার ইমেজ URL</label>
      <input type="url" id="bannerUrlInput" placeholder="https://...">
      <button id="saveSettingsBtn" type="button">সেটিংস আপডেট করুন</button>
    </div>

    <!-- ২. ম্যানুয়াল ব্যালেন্স অ্যাডজাস্টমেন্ট -->
    <div class="card">
      <h2>💳 ইউজারের ব্যালেন্স পরিবর্তন করুন</h2>
      <label>ইউজারনেম:</label>
      <input type="text" id="adjustUsernameInput" placeholder="ইউজারনেম লিখুন">
      <label>নতুন ব্যালেন্স (৳):</label>
      <input type="number" id="adjustBalanceInput" placeholder="যেমন: 500">
      <button id="updateUserBalanceBtn" type="button">ব্যালেন্স আপডেট করুন</button>
    </div>

    <!-- ৩. গেম যোগ করুন -->
    <div class="card">
      <h2>🎮 গেমের HTML পেস্ট করে লবিতে যোগ করুন</h2>
      <label>গেমের নাম:</label>
      <input type="text" id="gameNameInput" placeholder="যেমন: Ludo / Slot">
      <label>ক্যাটাগরি:</label>
      <select id="gameCategorySelect">
        <option value="hot">হট গেম</option>
        <option value="slot">স্লট</option>
        <option value="fish">ফিশিং</option>
        <option value="casino">ক্যাসিনো</option>
      </select>
      <label>কভার ছবির URL:</label>
      <input type="url" id="gameCoverInput" placeholder="https://...">
      <label>Index.html কোড পেস্ট করুন:</label>
      <textarea id="gameHtmlCodeInput" placeholder="<!DOCTYPE html>..."></textarea>
      <button id="publishGameBtn" type="button">লবিতে পাবলিশ করুন</button>
    </div>

    <!-- ৪. ডিপোজিট অ্যাপ্রুভাল -->
    <div class="card">
      <h2>💰 ডিপোজিট ম্যানেজমেন্ট</h2>
      <ul class="item-list" id="depositList"><li>লোড হচ্ছে...</li></ul>
    </div>

    <!-- ৫. উইথড্র অ্যাপ্রুভাল -->
    <div class="card">
      <h2>💸 উইথড্র ম্যানেজমেন্ট</h2>
      <ul class="item-list" id="withdrawList"><li>লোড হচ্ছে...</li></ul>
    </div>

    <!-- ৬. লাইভ চ্যাট সাপোর্ট -->
    <div class="card">
      <h2>💬 লাইভ চ্যাট সাপোর্ট</h2>
      <div id="chatUserList" style="max-height: 120px; overflow-y: auto; margin-bottom: 8px;"><div style="font-size:11px; color:#aaa;">কোনো চ্যাট নেই।</div></div>
      <div id="activeChatBox" style="background:#0a0b0d; padding:8px; border-radius:4px; height:100px; overflow-y:auto; display:none; font-size:11px; margin-bottom:6px;"></div>
      <div id="adminChatInputRow" style="display:none; gap:4px;">
        <input type="text" id="adminReplyInput" placeholder="উত্তর লিখুন..." style="margin:0;">
        <button id="sendAdminReplyBtn" style="width:60px;" type="button">পাঠান</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASh4Og6vNlk6CCRtUep5y9etqcCxB-9iE",
      databaseURL: "https://obb-config-38c44-default-rtdb.firebaseio.com",
      projectId: "obb-config-38c44"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let selectedChatUser = null;

    // Load initial settings
    get(ref(db, 'settings')).then(snap => {
      const data = snap.val() || {};
      if(data.siteTitle) document.getElementById('siteTitleInput').value = data.siteTitle;
      if(data.adminNumber) document.getElementById('adminNumberInput').value = data.adminNumber;
      if(data.bannerUrl) document.getElementById('bannerUrlInput').value = data.bannerUrl;
    });

    // Save Settings
    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
      const title = document.getElementById('siteTitleInput').value.trim();
      const num = document.getElementById('adminNumberInput').value.trim();
      const banner = document.getElementById('bannerUrlInput').value.trim();
      set(ref(db, 'settings'), { siteTitle: title, adminNumber: num, bannerUrl: banner })
        .then(() => alert("সেটিংস সফলভাবে আপডেট হয়েছে!"));
    });

    // Adjust User Balance Manually
    document.getElementById('updateUserBalanceBtn').addEventListener('click', () => {
      const user = document.getElementById('adjustUsernameInput').value.trim();
      const newBal = parseFloat(document.getElementById('adjustBalanceInput').value);

      if(!user || isNaN(newBal)) return alert("ইউজারনেম এবং সঠিক ব্যালেন্স দিন!");

      const userRef = ref(db, 'users/' + user);
      get(userRef).then(snap => {
        if(!snap.exists()) return alert("এই ইউজার খুঁজে পাওয়া যায়নি!");
        set(ref(db, 'users/' + user + '/balance'), newBal).then(() => {
          alert(`ইউজার ${user}-এর ব্যালেন্স ৳${newBal} আপডেট করা হয়েছে!`);
          document.getElementById('adjustUsernameInput').value = '';
          document.getElementById('adjustBalanceInput').value = '';
        });
      });
    });

    // Publish Game
    document.getElementById('publishGameBtn').addEventListener('click', () => {
      const name = document.getElementById('gameNameInput').value.trim();
      const cat = document.getElementById('gameCategorySelect').value;
      const cover = document.getElementById('gameCoverInput').value.trim();
      const code = document.getElementById('gameHtmlCodeInput').value.trim();

      if(!name || !code) return alert("গেমের নাম এবং HTML কোড দিন!");

      push(ref(db, 'games'), {
        gameName: name,
        category: cat,
        coverUrl: cover,
        htmlCode: code,
        time: Date.now()
      }).then(() => {
        alert("গেমটি সফলভাবে লবিতে যোগ হয়েছে!");
        document.getElementById('gameNameInput').value = '';
        document.getElementById('gameCoverInput').value = '';
        document.getElementById('gameHtmlCodeInput').value = '';
      });
    });

    // Deposit List & Approval
    onValue(ref(db, 'deposits'), (snapshot) => {
      const list = document.getElementById('depositList');
      list.innerHTML = '';
      const data = snapshot.val();
      let has = false;

      for(let key in data) {
        if(data[key].status === 'pending') {
          has = true;
          const item = data[key];
          list.innerHTML += `
            <li>
              <b>ইউজার:</b> ${item.userId} | <b>পরিমাণ:</b> ৳${item.amount} <br>
              <b>Trx ID:</b> ${item.trxId}
              <div style="margin-top:6px;">
                <button class="btn-green approve-dep" data-key="${key}" data-user="${item.userId}" data-amount="${item.amount}" type="button">Approve</button>
                <button class="btn-red reject-dep" data-key="${key}" type="button">Reject</button>
              </div>
            </li>`;
        }
      }
      if(!has) list.innerHTML = '<li>কোনো প্যান্ডিং ডিপোজিট নেই।</li>';

      document.querySelectorAll('.approve-dep').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-key');
          const userId = btn.getAttribute('data-user');
          const amount = parseFloat(btn.getAttribute('data-amount'));
          approveDep(key, userId, amount);
        });
      });

      document.querySelectorAll('.reject-dep').forEach(btn => {
        btn.addEventListener('click', () => rejectDep(btn.getAttribute('data-key')));
      });
    });

    function approveDep(key, userId, amount) {
      const balRef = ref(db, 'users/' + userId + '/balance');
      get(balRef).then((snap) => {
        const currentBal = snap.val() || 0;
        set(balRef, currentBal + amount).then(() => {
          set(ref(db, 'deposits/' + key + '/status'), 'approved');
          alert("ডিপোজিট অ্যাপ্রুভ হয়েছে এবং ইউজারের একাউন্টে ব্যালেন্স যোগ হয়েছে!");
        });
      });
    }

    function rejectDep(key) {
      set(ref(db, 'deposits/' + key + '/status'), 'rejected');
      alert("ডিপোজিট রিজেক্ট করা হয়েছে!");
    }

    // Withdraw List & Approval
    onValue(ref(db, 'withdrawals'), (snapshot) => {
      const list = document.getElementById('withdrawList');
      list.innerHTML = '';
      const data = snapshot.val();
      let has = false;

      for(let key in data) {
        if(data[key].status === 'pending') {
          has = true;
          const item = data[key];
          list.innerHTML += `
            <li>
              <b>ইউজার:</b> ${item.userId} | <b>পরিমাণ:</b> ৳${item.amount} <br>
              <b>নম্বর:</b> ${item.number}
              <div style="margin-top:6px;">
                <button class="btn-green approve-wit" data-key="${key}" data-user="${item.userId}" data-amount="${item.amount}" type="button">Approve</button>
                <button class="btn-red reject-wit" data-key="${key}" type="button">Reject</button>
              </div>
            </li>`;
        }
      }
      if(!has) list.innerHTML = '<li>কোনো প্যান্ডিং উইথড্র নেই।</li>';

      document.querySelectorAll('.approve-wit').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-key');
          const userId = btn.getAttribute('data-user');
          const amount = parseFloat(btn.getAttribute('data-amount'));
          approveWit(key, userId, amount);
        });
      });

      document.querySelectorAll('.reject-wit').forEach(btn => {
        btn.addEventListener('click', () => rejectWit(btn.getAttribute('data-key')));
      });
    });

    function approveWit(key, userId, amount) {
      const balRef = ref(db, 'users/' + userId + '/balance');
      get(balRef).then((snap) => {
        const currentBal = snap.val() || 0;
        if(currentBal < amount) return alert("ইউজারের একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");

        set(balRef, currentBal - amount).then(() => {
          set(ref(db, 'withdrawals/' + key + '/status'), 'approved');
          alert("উইথড্র অ্যাপ্রুভ হয়েছে এবং ইউজারের ব্যালেন্স কেটে নেওয়া হয়েছে!");
        });
      });
    }

    function rejectWit(key) {
      set(ref(db, 'withdrawals/' + key + '/status'), 'rejected');
      alert("উইথড্র রিজেক্ট করা হয়েছে!");
    }

    // Live Chat Management
    onValue(ref(db, 'chats'), (snapshot) => {
      const chatUserList = document.getElementById('chatUserList');
      chatUserList.innerHTML = '';
      const data = snapshot.val();
      if(!data) { chatUserList.innerHTML = '<div style="font-size:11px; color:#aaa;">কোনো চ্যাট নেই।</div>'; return; }

      for(let userId in data) {
        chatUserList.innerHTML += `<div class="chat-user-btn chat-user-item" data-userid="${userId}"><i class="fa-solid fa-user"></i> ইউজার: ${userId}</div>`;
      }

      document.querySelectorAll('.chat-user-item').forEach(item => {
        item.addEventListener('click', () => {
          openAdminChat(item.getAttribute('data-userid'));
        });
      });
    });

    function openAdminChat(userId) {
      selectedChatUser = userId;
      document.getElementById('activeChatBox').style.display = 'block';
      document.getElementById('adminChatInputRow').style.display = 'flex';

      onValue(ref(db, 'chats/' + userId), (snapshot) => {
        const box = document.getElementById('activeChatBox');
        box.innerHTML = '';
        const data = snapshot.val();
        for(let k in data) {
          box.innerHTML += `<div><b>${data[k].sender}:</b> ${data[k].message}</div>`;
        }
        box.scrollTop = box.scrollHeight;
      });
    }

    document.getElementById('sendAdminReplyBtn').addEventListener('click', () => {
      const text = document.getElementById('adminReplyInput').value.trim();
      if(!text || !selectedChatUser) return;
      push(ref(db, 'chats/' + selectedChatUser), { sender: 'admin', message: text, time: Date.now() })
        .then(() => { document.getElementById('adminReplyInput').value = ''; });
    });
  </script>
</body>
</html>
