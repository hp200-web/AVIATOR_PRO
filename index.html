<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game & Live Chat Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding-bottom: 70px;
        }

        /* Top Header */
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Screen Sections */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Auth Forms */
        .auth-card, .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        input, button, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            border: 1px solid #334155;
        }

        .game-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Profile & Avatar */
        .avatar-box {
            text-align: center;
            margin-bottom: 15px;
        }

        .avatar-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #2563eb;
            object-fit: cover;
        }

        /* Chat System */
        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            background-color: #0f172a;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .chat-msg.user {
            background-color: #2563eb;
            align-self: flex-end;
        }

        .chat-msg.admin {
            background-color: #334155;
            align-self: flex-start;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #334155;
            z-index: 1000;
        }

        .nav-item {
            color: #94a3b8;
            background: none;
            border: none;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 0;
        }

        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <header id="top-header">গেমিং পোর্টাল</header>

    <div class="container">
        
        <!-- ১. অথেনটিকেশন স্ক্রিন -->
        <div id="auth-screen" class="screen active">
            <div class="auth-card">
                <h3>লগইন / সাইনআপ</h3>
                <input type="email" id="auth-email" placeholder="ইমেইল দিন">
                <input type="password" id="auth-password" placeholder="পাসওয়ার্ড দিন">
                <button onclick="handleAuth()">লগইন / একাউন্ট খুলুন</button>
            </div>
        </div>

        <!-- ২. হোম স্ক্রিন -->
        <div id="home-screen" class="screen">
            <h3>উপলব্ধ গেমসমূহ</h3>
            <p style="margin-bottom: 10px; font-size: 0.9rem; color: #94a3b8;">প্রফিট রেট: <span id="current-profit-rate">1.8x</span></p>
            <div class="game-grid" id="game-list">
                <!-- ডায়নামিক গেম লোড হবে -->
            </div>
        </div>

        <!-- ৩. প্রমোশন স্ক্রিন -->
        <div id="promo-screen" class="screen">
            <div class="card">
                <h3>বিশেষ অফার ও প্রমোশন</h3>
                <p style="margin-top: 10px; color: #cbd5e1;">প্রতিটি ডিপোজিটে পান ২০% বোনাস! অফারটি সীমিত সময়ের জন্য।</p>
            </div>
        </div>

        <!-- ৪. লাইভ চ্যাট সাপোর্ট স্ক্রিন -->
        <div id="chat-screen" class="screen">
            <div class="card">
                <h3>লাইভ চ্যাট সাপোর্ট</h3>
                <div class="chat-box" id="chat-messages">
                    <div class="chat-msg admin">হ্যালো! আপনাকে কীভাবে সাহায্য করতে পারি?</div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chat-input" placeholder="মেসেজ লিখুন..." style="margin: 0;">
                    <button onclick="sendChatMessage()" style="width: 80px; margin: 0;">পাঠান</button>
                </div>
            </div>
        </div>

        <!-- ৫. ইউজার প্রোফাইল স্ক্রিন -->
        <div id="profile-screen" class="screen">
            <div class="card">
                <div class="avatar-box">
                    <img id="avatar-preview" class="avatar-img" src="https://via.placeholder.com/90" alt="Avatar">
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="updateAvatar(event)">
                    <button onclick="document.getElementById('avatar-input').click()" style="margin-top: 10px;">আইকন পরিবর্তন করুন</button>
                </div>
                <p><strong>ইমেইল:</strong> <span id="user-email-display">-</span></p>
                <p><strong>ইউজার আইডি:</strong> <span id="user-id-display">-</span></p>
                <button onclick="logout()" style="background-color: #ef4444; margin-top: 15px;">লগআউট</button>
            </div>
        </div>

    </div>

    <!-- বটম নেভিগেশন বার -->
    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item active" onclick="switchTab('home-screen', this)">
            <span>🏠</span>
            <span>হোম</span>
        </button>
        <button class="nav-item" onclick="switchTab('promo-screen', this)">
            <span>🎁</span>
            <span>প্রমোশন</span>
        </button>
        <button class="nav-item" onclick="switchTab('chat-screen', this)">
            <span>💬</span>
            <span>লাইভ চ্যাট</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile-screen', this)">
            <span>👤</span>
            <span>প্রোফাইল</span>
        </button>
    </nav>

    <!-- Firebase v9 Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ⚠️ আপনার Firebase Console থেকে সংগৃহীত আসল কী দিয়ে নিচের অংশটুকু পরিবর্তন করবেন
        const firebaseConfig = {
            apiKey: "YOUR_REAL_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Global Functions Exposure
        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return alert('ইমেইল ও পাসওয়ার্ড সঠিকভাবে দিন');

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (err) {
                        alert('অ্যাকাউন্ট তৈরি করা যায়নি: ' + err.message);
                    }
                } else {
                    alert('অথেনটিকেশন ব্যর্থ হয়েছে: ' + error.message);
                }
            }
        };

        window.logout = () => signOut(auth);

        window.switchTab = (screenId, btnElement) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(btnElement) btnElement.classList.add('active');
        };

        window.updateAvatar = (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('avatar-preview').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.sendChatMessage = () => {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg || !auth.currentUser) return;

            const chatBox = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg user';
            msgDiv.innerText = msg;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Save to Firebase Realtime Database
            push(ref(db, 'chats/' + auth.currentUser.uid), {
                sender: 'user',
                text: msg,
                timestamp: Date.now()
            });

            input.value = '';
        };

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('main-nav').style.display = 'flex';
                document.getElementById('home-screen').classList.add('active');
                
                document.getElementById('user-email-display').innerText = user.email;
                document.getElementById('user-id-display').innerText = user.uid;

                // Load Settings from Admin Control in Realtime
                onValue(ref(db, 'settings/gameControl'), (snapshot) => {
                    const data = snapshot.val();
                    if(data && data.profitRate) {
                        document.getElementById('current-profit-rate').innerText = data.profitRate + 'x';
                    }
                });
            } else {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('auth-screen').classList.add('active');
                document.getElementById('main-nav').style.display = 'none';
            }
        });
    </script>
</body>
</html>
