<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CV999 - VIP Gaming Platform</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f1014;color:#fff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#authScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(145deg,#101114,#191b21)
}
.auth-box{
  width:100%;max-width:420px;background:#191b20;border:1px solid #2d3038;
  border-radius:18px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.45)
}
.auth-logo{text-align:center;font-size:28px;font-weight:800;color:#ff8c00;margin-bottom:22px}
.tabs{display:flex;gap:5px;background:#101114;padding:4px;border-radius:10px;margin-bottom:18px}
.tabs button{
  flex:1;border:0;background:transparent;color:#999;padding:12px;border-radius:8px
}
.tabs button.active{background:#ff8c00;color:#111;font-weight:800}
.form{display:flex;flex-direction:column;gap:12px}
.form input,.modal-box input,.chat-input{
  width:100%;padding:13px;background:#101114;color:#fff;border:1px solid #353841;
  border-radius:10px;outline:none
}
.form input:focus,.modal-box input:focus,.chat-input:focus{border-color:#ff8c00}
.primary{
  border:0;background:#ff8c00;color:#111;font-weight:800;padding:13px;border-radius:10px
}
.primary:disabled{opacity:.55;cursor:not-allowed}
.auth-status{text-align:center;min-height:22px;margin-top:10px;color:#ffb15c;font-size:13px}

#mainAppContent{display:none;min-height:100vh;padding-bottom:72px}
header{
  position:sticky;top:0;z-index:20;background:#181a20;border-bottom:1px solid #2a2d34;
  padding:13px 15px;display:flex;align-items:center;justify-content:space-between
}
.brand{color:#ff8c00;font-weight:800;font-size:18px}
.balance{font-weight:800}.balance small{color:#888;font-weight:400;margin-right:4px}

.container{max-width:950px;margin:auto;padding:14px}
.view-section{display:none}.view-section.active{display:block}

.banner{
  width:100%;height:175px;object-fit:cover;border-radius:14px;background:#222;display:block
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.action{
  border:1px solid #30333a;background:#1a1c21;color:#fff;padding:13px;border-radius:10px
}
.action:hover{border-color:#ff8c00}

.categories{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.cat-item{
  white-space:nowrap;border:1px solid #30333a;background:#1a1c21;color:#aaa;
  padding:8px 14px;border-radius:20px
}
.cat-item.active{background:#ff8c00;color:#111;border-color:#ff8c00}

.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.game-card{
  overflow:hidden;background:#191b20;border:1px solid #292c33;border-radius:12px
}
.game-card img{display:block;width:100%;height:125px;object-fit:cover}
.game-title{padding:10px;font-weight:700}
.empty{text-align:center;color:#777;padding:35px;grid-column:1/-1}

.chat-box,.profile-card{
  background:#191b20;border:1px solid #292c33;border-radius:12px;padding:14px
}
.chat-messages{
  height:260px;overflow-y:auto;border:1px solid #30333a;border-radius:9px;padding:10px;
  margin-bottom:9px
}
.chat-message{background:#23252b;border-radius:8px;padding:8px;margin-bottom:7px;font-size:13px}
.chat-row{display:flex;gap:7px}.chat-input{flex:1}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:#181a20;border-top:1px solid #2a2d34
}
.nav-item{
  flex:1;text-align:center;padding:10px 4px;color:#888;font-size:12px
}
.nav-item i{display:block;font-size:18px;margin-bottom:3px}
.nav-item.active{color:#ff8c00}

.secondary{
  border:1px solid #3b3e46;background:#24262c;color:#fff;padding:11px;border-radius:9px
}
.danger{
  border:0;background:#c83e3e;color:#fff;padding:11px;border-radius:9px;margin-top:8px
}

.modal{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;padding:16px
}
.modal-box{
  width:100%;max-width:420px;background:#191b20;border:1px solid #30333a;
  border-radius:15px;padding:18px
}
.modal-box h3{margin-top:0}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions>*{flex:1}

#gameLauncher{
  position:fixed;inset:0;z-index:100;background:#08090b;display:none;flex-direction:column
}
.game-head{
  height:52px;flex:none;background:#181a20;padding:0 12px;display:flex;
  align-items:center;justify-content:space-between
}
.game-close{
  border:0;background:#292c33;color:#fff;padding:8px 12px;border-radius:8px
}
.game-frame{width:100%;height:calc(100% - 52px);border:0;background:#fff}

@media(min-width:650px){
  .game-grid{grid-template-columns:repeat(4,1fr)}
  .game-card img{height:140px}
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<section id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <i class="fa-solid fa-gamepad"></i>
      <span id="authLogoText">CV999</span>
    </div>

    <div class="tabs">
      <button id="loginTabBtn" class="active">লগইন</button>
      <button id="registerTabBtn">রেজিস্ট্রেশন</button>
    </div>

    <div id="loginForm" class="form">
      <input id="loginEmail" type="email" placeholder="ইমেইল" autocomplete="email">
      <input id="loginPassword" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
      <button id="loginBtn" class="primary">লগইন</button>
    </div>

    <div id="registerForm" class="form hidden">
      <input id="regEmail" type="email" placeholder="ইমেইল" autocomplete="email">
      <input id="regPassword" type="password" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড" autocomplete="new-password">
      <button id="registerBtn" class="primary">একাউন্ট তৈরি করুন</button>
    </div>

    <div id="authStatus" class="auth-status"></div>
  </div>
</section>

<!-- ================= MAIN APP ================= -->
<main id="mainAppContent">

<header>
  <div class="brand">
    <i class="fa-solid fa-gamepad"></i>
    <span id="siteTitle">CV999</span>
  </div>
  <div class="balance">
    <small>Balance</small>
    ৳<span id="userBalance">0.00</span>
  </div>
</header>

<div class="container">

  <!-- HOME -->
  <section id="homeView" class="view-section active">
    <img id="mainBanner" class="banner" alt="Banner">

    <div class="actions">
      <button id="depositBtn" class="action">
        <i class="fa-solid fa-plus"></i> ডিপোজিট
      </button>
      <button id="withdrawBtn" class="action">
        <i class="fa-solid fa-minus"></i> উইথড্র
      </button>
    </div>

    <div class="categories">
      <button class="cat-item active" data-cat="hot">সব</button>
      <button class="cat-item" data-cat="casino">ক্যাসিনো</button>
      <button class="cat-item" data-cat="slots">স্লট</button>
      <button class="cat-item" data-cat="sports">স্পোর্টস</button>
    </div>

    <div id="gameGrid" class="game-grid"></div>
  </section>

  <!-- CHAT -->
  <section id="chatView" class="view-section">
    <h3>লাইভ চ্যাট</h3>
    <div class="chat-box">
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-row">
        <input id="chatInput" class="chat-input" placeholder="মেসেজ লিখুন...">
        <button id="sendChatBtn" class="primary">পাঠান</button>
      </div>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="profileView" class="view-section">
    <h3>প্রোফাইল</h3>
    <div class="profile-card">
      <p>UID: <b id="profileUserId">—</b></p>
      <p>ইমেইল: <b id="profileEmail">—</b></p>
      <p>ব্যালেন্স: <b>৳<span id="profileBalance">0.00</span></b></p>

      <button id="refreshBalanceBtn" class="secondary">
        ব্যালেন্স রিফ্রেশ
      </button>

      <br>

      <button id="logoutBtn" class="danger">
        লগআউট
      </button>
    </div>
  </section>

</div>

<nav class="bottom-nav">
  <div class="nav-item active" data-view="homeView">
    <i class="fa-solid fa-house"></i>হোম
  </div>
  <div class="nav-item" data-view="chatView">
    <i class="fa-solid fa-comments"></i>চ্যাট
  </div>
  <div class="nav-item" data-view="profileView">
    <i class="fa-solid fa-user"></i>প্রোফাইল
  </div>
</nav>

</main>

<!-- ================= DEPOSIT MODAL ================= -->
<div id="depositModal" class="modal">
  <div class="modal-box">
    <h3>ডিপোজিট রিকোয়েস্ট</h3>
    <input id="depositAmount" type="number" min="1" placeholder="পরিমাণ">
    <input id="depositRef" placeholder="রেফারেন্স / ট্রানজেকশন আইডি">

    <div class="modal-actions">
      <button class="secondary closeModal">বন্ধ</button>
      <button id="submitDeposit" class="primary">সাবমিট</button>
    </div>
  </div>
</div>

<!-- ================= WITHDRAW MODAL ================= -->
<div id="withdrawModal" class="modal">
  <div class="modal-box">
    <h3>উইথড্র রিকোয়েস্ট</h3>
    <input id="withdrawAmount" type="number" min="1" placeholder="পরিমাণ">
    <input id="withdrawMethod" placeholder="মেথড / নম্বর">

    <div class="modal-actions">
      <button class="secondary closeModal">বন্ধ</button>
      <button id="submitWithdraw" class="primary">সাবমিট</button>
    </div>
  </div>
</div>

<!-- ================= GAME LAUNCHER ================= -->
<div id="gameLauncher">
  <div class="game-head">
    <b id="currentGameTitle">Game</b>
    <button id="closeGameLauncherBtn" class="game-close">বন্ধ করুন</button>
  </div>
  <iframe
    id="gameIframe"
    class="game-frame"
    sandbox="allow-scripts allow-forms allow-modals allow-popups">
  </iframe>
</div>

<script>
"use strict";

/* =========================================================
   FIREBASE CONFIG
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAyTOnCm5IuPcB-yvGjFl3KbwRVxNrcNSY",
  authDomain: "ff-to-gaming-4ea1b.firebaseapp.com",
  databaseURL: "https://ff-to-gaming-4ea1b-default-rtdb.firebaseio.com",
  projectId: "ff-to-gaming-4ea1b",
  storageBucket: "ff-to-gaming-4ea1b.appspot.com",
  messagingSenderId: "816776130875",
  appId: "1:816776130875:web:c3e7984e0de53cbd89871e"
};

let auth = null;
let db = null;
let currentUser = null;
let currentUserBalance = 0;
let allGames = {};
let selectedCategory = "hot";
let balanceListener = null;
let settingsListener = null;
let gamesListener = null;
let chatListener = null;

/* =========================================================
   HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);

function show(el, display = "block") {
  if (el) el.style.display = display;
}

function hide(el) {
  if (el) el.style.display = "none";
}

function setAuthStatus(message, isError = false) {
  $("authStatus").textContent = message || "";
  $("authStatus").style.color = isError ? "#ff6565" : "#ffb15c";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function firebaseError(error) {
  const code = error && error.code ? error.code : "";

  const messages = {
    "auth/invalid-email": "ইমেইল ঠিক নয়।",
    "auth/user-not-found": "এই ইমেইলে কোনো একাউন্ট পাওয়া যায়নি।",
    "auth/wrong-password": "পাসওয়ার্ড ভুল।",
    "auth/invalid-credential": "ইমেইল অথবা পাসওয়ার্ড ভুল।",
    "auth/email-already-in-use": "এই ইমেইল আগে থেকেই ব্যবহার করা হয়েছে।",
    "auth/weak-password": "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।",
    "auth/operation-not-allowed": "Firebase Console-এ Email/Password Sign-in চালু করুন।",
    "auth/network-request-failed": "নেটওয়ার্ক সমস্যা হয়েছে।",
    "auth/too-many-requests": "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
    "database/permission-denied": "Database permission denied। Firebase Rules পরীক্ষা করুন।"
  };

  return messages[code] || error?.message || "অজানা সমস্যা হয়েছে।";
}

/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */
function initializeFirebase() {
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    auth = firebase.auth();
    db = firebase.database();

    return true;
  } catch (error) {
    console.error("Firebase initialization error:", error);
    setAuthStatus("Firebase চালু করা যায়নি।", true);
    return false;
  }
}

/* =========================================================
   AUTH
   ========================================================= */
async function registerUser() {
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;

  if (!email || !password) {
    setAuthStatus("ইমেইল ও পাসওয়ার্ড দিন!", true);
    return;
  }

  if (password.length < 6) {
    setAuthStatus("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।", true);
    return;
  }

  const button = $("registerBtn");
  button.disabled = true;
  setAuthStatus("একাউন্ট তৈরি হচ্ছে...");

  try {
    const credential =
      await auth.createUserWithEmailAndPassword(email, password);

    /*
      User profile is stored by Firebase UID.
      Password is NOT stored in Realtime Database.
    */
    await db.ref("users/" + credential.user.uid).set({
      email: email,
      balance: 0,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });

    setAuthStatus("একাউন্ট সফলভাবে তৈরি হয়েছে।");
  } catch (error) {
    console.error("Registration error:", error);
    setAuthStatus(firebaseError(error), true);
  } finally {
    button.disabled = false;
  }
}

async function loginUser() {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if (!email || !password) {
    setAuthStatus("ইমেইল ও পাসওয়ার্ড দিন!", true);
    return;
  }

  const button = $("loginBtn");
  button.disabled = true;
  setAuthStatus("লগইন হচ্ছে...");

  try {
    await auth.signInWithEmailAndPassword(email, password);
    setAuthStatus("");
  } catch (error) {
    console.error("Login error:", error);
    setAuthStatus(firebaseError(error), true);
  } finally {
    button.disabled = false;
  }
}

async function logoutUser() {
  try {
    await auth.signOut();
  } catch (error) {
    console.error("Logout error:", error);
    alert(firebaseError(error));
  }
}

/* =========================================================
   APP OPEN/CLOSE
   ========================================================= */
function openMainApp(user) {
  currentUser = user;

  hide($("authScreen"));
  show($("mainAppContent"));

  $("profileUserId").textContent = user.uid;
  $("profileEmail").textContent = user.email || "";

  loadSettings();
  loadGames();
  loadUserBalance();
  listenUserChat();
}

function closeMainApp() {
  currentUser = null;
  currentUserBalance = 0;

  if (balanceListener) {
    db.ref(balanceListener).off();
    balanceListener = null;
  }

  if (settingsListener) {
    db.ref("settings").off("value", settingsListener);
    settingsListener = null;
  }

  if (gamesListener) {
    db.ref("games").off("value", gamesListener);
    gamesListener = null;
  }

  if (chatListener) {
    db.ref("chats").off("value", chatListener);
    chatListener = null;
  }

  hide($("mainAppContent"));
  show($("authScreen"), "flex");
}

/* =========================================================
   SETTINGS
   ========================================================= */
function loadSettings() {
  if (!db) return;

  if (settingsListener) {
    db.ref("settings").off("value", settingsListener);
  }

  settingsListener = snapshot => {
    const data = snapshot.val() || {};

    if (data.siteTitle) {
      $("siteTitle").textContent = data.siteTitle;
      $("authLogoText").textContent = data.siteTitle;
      document.title = data.siteTitle;
    }

    if (data.bannerUrl) {
      $("mainBanner").src = data.bannerUrl;
    } else {
      $("mainBanner").src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350">' +
          '<rect width="100%" height="100%" fill="#222"/>' +
          '<text x="50%" y="50%" fill="#ff8c00" font-size="42" text-anchor="middle">CV999</text>' +
          '</svg>'
        );
    }
  };

  db.ref("settings").on("value", settingsListener);
}

/* =========================================================
   GAMES
   ========================================================= */
function loadGames() {
  if (!db) return;

  if (gamesListener) {
    db.ref("games").off("value", gamesListener);
  }

  gamesListener = snapshot => {
    allGames = snapshot.val() || {};
    renderGameGrid();
  };

  db.ref("games").on("value", gamesListener, error => {
    console.error("Games listener error:", error);
  });
}

function renderGameGrid() {
  const grid = $("gameGrid");
  grid.innerHTML = "";

  const ids = Object.keys(allGames);

  ids.forEach(id => {
    const game = allGames[id] || {};
    const category = game.category || "hot";

    if (
      selectedCategory !== "hot" &&
      category !== selectedCategory
    ) {
      return;
    }

    const card = document.createElement("div");
    card.className = "game-card";

    const cover =
      game.coverUrl ||
      "https://via.placeholder.com/500x300/1a1b22/ff8c00?text=GAME";

    card.innerHTML =
      '<img src="' + escapeHTML(cover) + '" alt="">' +
      '<div class="game-title">' +
      escapeHTML(game.gameName || "Game") +
      "</div>";

    card.addEventListener("click", () => launchGame(game));

    grid.appendChild(card);
  });

  if (!grid.children.length) {
    grid.innerHTML =
      '<div class="empty">এখন কোনো গেম পাওয়া যায়নি।</div>';
  }
}

/* =========================================================
   BALANCE
   ========================================================= */
function loadUserBalance() {
  if (!currentUser || !db) return;

  const path = "users/" + currentUser.uid + "/balance";

  if (balanceListener) {
    db.ref(balanceListener).off();
  }

  balanceListener = path;

  db.ref(path).on(
    "value",
    snapshot => {
      currentUserBalance = Number(snapshot.val() || 0);

      $("userBalance").textContent =
        currentUserBalance.toFixed(2);

      $("profileBalance").textContent =
        currentUserBalance.toFixed(2);
    },
    error => {
      console.error("Balance listener error:", error);
    }
  );
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function switchView(viewId, element) {
  document
    .querySelectorAll(".view-section")
    .forEach(section => section.classList.remove("active"));

  document
    .querySelectorAll(".nav-item")
    .forEach(item => item.classList.remove("active"));

  $(viewId).classList.add("active");
  element.classList.add("active");
}

function switchCategory(category, element) {
  document
    .querySelectorAll(".cat-item")
    .forEach(item => item.classList.remove("active"));

  element.classList.add("active");

  selectedCategory = category;
  renderGameGrid();
}

/* =========================================================
   GAME LAUNCHER
   ========================================================= */
function launchGame(game) {
  if (!currentUser) return;

  $("currentGameTitle").textContent =
    game.gameName || "Game";

  const html = game.htmlCode || `
    <html>
      <body style="font-family:Arial;text-align:center;padding:40px">
        <h2>Game code পাওয়া যায়নি</h2>
      </body>
    </html>
  `;

  const bridge =
    "<script>" +
    "window.userBalance=" +
    JSON.stringify(currentUserBalance) +
    ";" +
    "window.userId=" +
    JSON.stringify(currentUser.uid) +
    ";" +
    "window.updateBalance=function(amount){" +
    "window.parent.postMessage({type:'UPDATE_BALANCE',amount:Number(amount)},'*')" +
    "};" +
    "<\/script>";

  $("gameIframe").srcdoc =
    html.includes("<head>")
      ? html.replace("<head>", "<head>" + bridge)
      : bridge + html;

  show($("gameLauncher"), "flex");
}

function closeGameLauncher() {
  hide($("gameLauncher"));
  $("gameIframe").srcdoc = "";
}

/* =========================================================
   CHAT
   ========================================================= */
function listenUserChat() {
  if (!currentUser || !db) return;

  if (chatListener) {
    db.ref("chats/" + currentUser.uid).off("value", chatListener);
  }

  chatListener = snapshot => {
    const box = $("chatMessages");
    box.innerHTML = "";

    snapshot.forEach(child => {
      const data = child.val() || {};
      const div = document.createElement("div");

      div.className = "chat-message";
      div.innerHTML =
        "<b>" +
        escapeHTML(data.user || currentUser.email || "User") +
        "</b><br>" +
        escapeHTML(data.message || "");

      box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
  };

  db.ref("chats/" + currentUser.uid)
    .limitToLast(100)
    .on("value", chatListener);
}

async function sendChat() {
  if (!currentUser) return;

  const input = $("chatInput");
  const message = input.value.trim();

  if (!message) return;

  input.value = "";

  try {
    await db.ref("chats/" + currentUser.uid).push({
      user: currentUser.email || currentUser.uid,
      message: message,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });
  } catch (error) {
    console.error("Chat error:", error);
    alert(firebaseError(error));
  }
}

/* =========================================================
   DEPOSIT / WITHDRAW REQUESTS
   ========================================================= */
async function submitDeposit() {
  if (!currentUser) return;

  const amount = Number($("depositAmount").value);
  const reference = $("depositRef").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("সঠিক পরিমাণ দিন।");
    return;
  }

  try {
    await db.ref("deposits").push({
      uid: currentUser.uid,
      email: currentUser.email || "",
      amount: amount,
      reference: reference,
      status: "pending",
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    alert("ডিপোজিট রিকোয়েস্ট পাঠানো হয়েছে।");

    $("depositAmount").value = "";
    $("depositRef").value = "";

    closeModals();
  } catch (error) {
    console.error("Deposit request error:", error);
    alert(firebaseError(error));
  }
}

async function submitWithdraw() {
  if (!currentUser) return;

  const amount = Number($("withdrawAmount").value);
  const method = $("withdrawMethod").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("সঠিক পরিমাণ দিন।");
    return;
  }

  if (amount > currentUserBalance) {
    alert("পর্যাপ্ত ব্যালেন্স নেই।");
    return;
  }

  try {
    await db.ref("withdrawals").push({
      uid: currentUser.uid,
      email: currentUser.email || "",
      amount: amount,
      method: method,
      status: "pending",
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    alert("উইথড্র রিকোয়েস্ট পাঠানো হয়েছে।");

    $("withdrawAmount").value = "";
    $("withdrawMethod").value = "";

    closeModals();
  } catch (error) {
    console.error("Withdraw request error:", error);
    alert(firebaseError(error));
  }
}

function closeModals() {
  document.querySelectorAll(".modal").forEach(modal => hide(modal));
}

/* =========================================================
   GAME MESSAGE BRIDGE
   ========================================================= */
window.addEventListener("message", event => {
  if (!currentUser) return;
  if (!event.data || event.data.type !== "UPDATE_BALANCE") return;

  const amount = Number(event.data.amount);

  if (!Number.isFinite(amount) || amount < 0) return;

  /*
    IMPORTANT:
    Production balance changes should be validated/enforced
    server-side with secure Firebase Rules/Cloud Functions.
  */
  db.ref("users/" + currentUser.uid + "/balance")
    .set(amount)
    .catch(error => console.error("Balance update error:", error));
});

/* =========================================================
   EVENT BINDINGS
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {

  $("loginTabBtn").addEventListener("click", () => {
    $("loginTabBtn").classList.add("active");
    $("registerTabBtn").classList.remove("active");

    $("loginForm").classList.remove("hidden");
    $("registerForm").classList.add("hidden");

    setAuthStatus("");
  });

  $("registerTabBtn").addEventListener("click", () => {
    $("registerTabBtn").classList.add("active");
    $("loginTabBtn").classList.remove("active");

    $("registerForm").classList.remove("hidden");
    $("loginForm").classList.add("hidden");

    setAuthStatus("");
  });

  $("loginBtn").addEventListener("click", loginUser);
  $("registerBtn").addEventListener("click", registerUser);
  $("logoutBtn").addEventListener("click", logoutUser);

  $("loginPassword").addEventListener("keydown", event => {
    if (event.key === "Enter") loginUser();
  });

  $("regPassword").addEventListener("keydown", event => {
    if (event.key === "Enter") registerUser();
  });

  $("refreshBalanceBtn").addEventListener("click", loadUserBalance);

  $("depositBtn").addEventListener("click", () => {
    show($("depositModal"), "flex");
  });

  $("withdrawBtn").addEventListener("click", () => {
    show($("withdrawModal"), "flex");
  });

  $("submitDeposit").addEventListener("click", submitDeposit);
  $("submitWithdraw").addEventListener("click", submitWithdraw);

  document
    .querySelectorAll(".closeModal")
    .forEach(button => button.addEventListener("click", closeModals));

  document
    .querySelectorAll(".nav-item")
    .forEach(item => {
      item.addEventListener("click", () =>
        switchView(item.dataset.view, item)
      );
    });

  document
    .querySelectorAll(".cat-item")
    .forEach(item => {
      item.addEventListener("click", () =>
        switchCategory(item.dataset.cat, item)
      );
    });

  $("sendChatBtn").addEventListener("click", sendChat);

  $("chatInput").addEventListener("keydown", event => {
    if (event.key === "Enter") sendChat();
  });

  $("closeGameLauncherBtn").addEventListener(
    "click",
    closeGameLauncher
  );

  /*
    Initialize Firebase before registering auth state listener.
  */
  if (!initializeFirebase()) return;

  /*
    This is the important authentication fix:
    the app now follows Firebase Auth state instead of
    using localStorage + plaintext passwords in RTDB.
  */
  auth.onAuthStateChanged(
    user => {
      if (user) {
        openMainApp(user);
      } else {
        closeMainApp();
      }
    },
    error => {
      console.error("Auth state error:", error);
      setAuthStatus(firebaseError(error), true);
    }
  );
});
</script>
